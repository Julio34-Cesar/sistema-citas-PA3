<h2>Iniciar sesión</h2>
<p class="ok" *ngIf="aviso">{{ aviso }}</p>
<p class="error" *ngIf="error">{{ error }}</p>
<form [formGroup]="form" (ngSubmit)="entrar()">
  <label>Correo <input type="email" formControlName="email" autocomplete="username"></label>
  <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Ingresa un correo válido</small>

  <label>Contraseña <input type="password" formControlName="password" autocomplete="current-password"></label>
  <small class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">La contraseña es obligatoria</small>

  <button class="btn" type="submit" [disabled]="cargando">Entrar</button>
  <span>¿No tienes cuenta? <a routerLink="/registro">Regístrate</a></span>
</form>
