<h2>{{ id ? 'Editar' : 'Nueva' }} cita</h2>
<p class="ok" *ngIf="mensaje">{{ mensaje }}</p>
<p class="error" *ngIf="error">{{ error }}</p>
<form [formGroup]="form" (ngSubmit)="guardar()">
  <label>Cliente <input formControlName="cliente"></label>
  <small class="error" *ngIf="form.get('cliente')?.touched && form.get('cliente')?.invalid">Mínimo 3 caracteres</small>

  <label>Teléfono <input formControlName="telefono" maxlength="9"></label>
  <small class="error" *ngIf="form.get('telefono')?.touched && form.get('telefono')?.invalid">9 dígitos numéricos</small>

  <label>Fecha <input type="date" formControlName="fecha"></label>
  <label>Hora <input type="time" formControlName="hora"></label>

  <label>Motivo <textarea formControlName="motivo"></textarea></label>
  <small class="error" *ngIf="form.get('motivo')?.touched && form.get('motivo')?.invalid">Mínimo 5 caracteres</small>

  <button type="submit">Guardar</button>
  <a routerLink="/citas">Cancelar</a>
</form>
