<h2>Crear cuenta</h2>
<p class="error" *ngIf="error">{{ error }}</p>
<form [formGroup]="form" (ngSubmit)="registrar()">
  <label>Nombre <input formControlName="nombre"></label>
  <small class="error" *ngIf="form.get('nombre')?.touched && form.get('nombre')?.invalid">Mínimo 3 caracteres</small>

  <label>Correo <input type="email" formControlName="email" autocomplete="username"></label>
  <small class="error" *ngIf="form.get('email')?.touched && form.get('email')?.invalid">Ingresa un correo válido</small>

  <label>Contraseña <input type="password" formControlName="password" autocomplete="new-password"></label>
  <small class="error" *ngIf="form.get('password')?.touched && form.get('password')?.invalid">Mínimo 6 caracteres</small>

  <label>Confirmar contraseña <input type="password" formControlName="confirmar" autocomplete="new-password"></label>
  <small class="error" *ngIf="noCoinciden">Las contraseñas no coinciden</small>

  <button class="btn" type="submit" [disabled]="cargando">Registrarme</button>
  <span>¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a></span>
</form>
